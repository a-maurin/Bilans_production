# ========================================================================================
# GABARIT DE PRESENTATION : INSTITUTIONNEL PAR DEFAUT (`gabarit_defaut.yaml`)
# ========================================================================================
# Ce fichier régit le gabarit de présentation par défaut pour l'édition des bilans et brochures PDF.
#
# Explication des clés pour les non-spécialistes :
#   - `gabarit_id` : identifiant unique du gabarit (répertorié dans les menus Web/CLI).
#   - `layout.pages` : grille déclarative de widgets répartis sur 2 pages.
#   - `cible` : `les_deux` (s'applique aussi bien au bilan PDF qu'à la brochure PDF).
#   - `sections.order` : ordre d'enchaînement des chapitres dans le document.
# ========================================================================================

version: 1
gabarit_id: gabarit_defaut
label: "Gabarit institutionnel par défaut"
description: "Gabarit de présentation synthétique institutionnelle par défaut de l'OFB"

cible: les_deux

title:
  line2_mode: auto

sections:
  order:
    - sec1
    - sec2
    - sec4
    - sec3
    - sec6

cartographie:
  items_masques_brochure:
    - titre_principal
    - sous_titre
    - bandeau_titre
    - bandeau_logos_ofb
    - logo_ofb_bas_droite
    - bandeau_source

layout:
  type: grid
  pages:
    - page_number: 1
      rows:
        - columns:
            - width: "100%"
              widget:
                type: stat_kpi_grid
        - columns:
            - width: "50%"
              widget:
                type: map
            - width: "50%"
              widget:
                type: section_group
                sections: [sec1, sec2]
    - page_number: 2
      rows:
        - columns:
            - width: "50%"
              widget:
                type: theme_breakdown_table
            - width: "50%"
              widget:
                type: evolution_chart
