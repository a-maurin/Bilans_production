# ========================================================================================
# ALIAS RÉTROCOMPATIBILITÉ : BROCHURE DEFAULT (`brochure_defaut.yaml`)
# ========================================================================================
# Ce fichier redirige vers gabarit_defaut.yaml pour assurer la rétrocompatibilité.
# ========================================================================================

version: 1
gabarit_id: gabarit_defaut
label: "Gabarit institutionnel par défaut"
description: "Gabarit de présentation synthétique institutionnelle par défaut de l'OFB"

cible: les_deux

title:
  line2_mode: fixed
  line2_fixed: "Bilan Synthétique Institutionnel"

sections:
  order:
    - sec1
    - sec2
    - sec4
    - sec3
    - sec6

cartographie:
  items_masques_brochure:
    - titre_principal
    - sous_titre
    - bandeau_titre
    - bandeau_logos_ofb
    - logo_ofb_bas_droite
    - bandeau_source

layout:
  type: grid
  pages:
    - page_number: 1
      rows:
        - columns:
            - width: "100%"
              widget:
                type: stat_kpi_grid
        - columns:
            - width: "50%"
              widget:
                type: map
            - width: "50%"
              widget:
                type: section_group
                sections: [sec1, sec2]
    - page_number: 2
      rows:
        - columns:
            - width: "50%"
              widget:
                type: theme_breakdown_table
            - width: "50%"
              widget:
                type: evolution_chart
