# ========================================================================================
# GABARIT DE PRESENTATION : SERVICE REGIONAL POLICE BFC (`srp_r27.yaml`)
# ========================================================================================
# Ce fichier régit le gabarit visuel sur-mesure pour le Service Régional de Police (SRP)
# de Bourgogne-Franche-Comté (Région R27).
#
# Explication des clés pour les non-spécialistes :
#   - `gabarit_id` : identifiant unique du gabarit répertorié par le moteur d'édition Web/CLI.
#   - `layout` : format d'affichage (ici `brochure_custom` pour un rendu synthétique condensé).
#   - `title` : ligne de sous-titre fixe ("Service Régional Police – BFC").
#   - `sections.order` : ordre personnalisé d'enchaînement des chapitres dans le rapport PDF :
#       * sec1 : Introduction / Chiffres clés
#       * sec2 : Activité de contrôle (localisations, opérations, conformité)
#       * sec4 : Évolution temporelle et ventilations
#       * sec3 : Activité administrative et judiciaire (PA / PEJ / PVe)
#       * sec6 : Annexes et méthodologie
#   - `cartographie.items_masques_brochure` : masque les éléments d'habillage QGIS redondants
#     sur les cartes insérées dans la brochure PDF (titres, bandeaux et logos originaux).
# ========================================================================================

version: 1
gabarit_id: srp_r27
label: "R27 - Service Régional Police (BFC)"
description: "Gabarit de présentation avec mise en page brochure condensée pour le SRP Bourgogne-Franche-Comté"

cible: les_deux
organisation:
  code_region: r27
  service: srp

layout: brochure_custom

title:
  line2_mode: fixed
  line2_fixed: "Service Régional Police – BFC"

sections:
  order:
    - sec1
    - sec2
    - sec4
    - sec3
    - sec6

cartographie:
  items_masques_brochure:
    - titre_principal
    - sous_titre
    - bandeau_titre
    - bandeau_logos_ofb
    - logo_ofb_bas_droite
    - bandeau_source




